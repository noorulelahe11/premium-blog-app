<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Press — Modern Editorial Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lumina<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-blog.html">Create Blog</a>
        <div id="nav-auth-area" style="display:flex; gap:1rem; align-items:center;"></div>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Hero Featured Section -->
    <section class="hero">
      <div>
        <span class="hero-badge">Featured Story</span>
        <h1>Ideas, Craft & Modern Web Engineering.</h1>
        <p>A curated publication exploring thoughtful design, clean frontend architecture, and intentional living.</p>
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <a href="create-blog.html" class="btn btn-primary">Start Writing</a>
          <a href="#articles" class="btn btn-outline">Explore Articles</a>
        </div>
      </div>
      <img src="images/hero-banner.jpg" onerror="this.onerror=null; this.src='images/hero-banner.png';" alt="Editorial Workspace" class="hero-img">
    </section>

    <!-- Filter & Search -->
    <section id="articles">
      <div class="section-header">
        <div class="filter-tabs">
          <button class="tab-btn active" data-cat="All">All Stories</button>
          <button class="tab-btn" data-cat="Design">Design</button>
          <button class="tab-btn" data-cat="Technology">Technology</button>
          <button class="tab-btn" data-cat="Lifestyle">Lifestyle</button>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search articles...">
        </div>
      </div>

      <!-- Dynamic Blog Cards -->
      <div class="blog-grid" id="blog-grid"></div>
    </section>
  </main>

  <!-- Article Reader Modal -->
  <div class="modal-overlay" id="article-modal" onclick="if(event.target===this) closeArticle()">
    <div class="modal-box">
      <button class="modal-close" onclick="closeArticle()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Lumina Press. Crafted with clean HTML, CSS & JavaScript.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
