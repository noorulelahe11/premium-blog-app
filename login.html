<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lumina Press</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lumina<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html" class="btn btn-outline">Create Account</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to manage your articles and dashboard.</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Sign In</button>
      </form>
      <p style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:var(--text-secondary);">
        Don't have an account? <a href="register.html" style="color:var(--accent); font-weight:600;">Register</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
