<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Lumina Press</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lumina<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" class="btn btn-outline">Sign In</a>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create an account</h2>
      <p class="sub">Join Lumina Press and publish your first story today.</p>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Kamal Sekar A" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a strong password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account</button>
      </form>
      <p style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:var(--text-secondary);">
        Already have an account? <a href="login.html" style="color:var(--accent); font-weight:600;">Sign In</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
