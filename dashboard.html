<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Lumina Press</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lumina<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="create-blog.html" class="btn btn-primary">+ New Article</a>
        <button onclick="logoutUser()" class="btn btn-outline">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-header">
      <div>
        <h1 id="welcome-user" style="font-size:2rem;">Dashboard</h1>
        <p style="color:var(--text-secondary);">Manage your published articles and track engagement.</p>
      </div>
      <a href="create-blog.html" class="btn btn-primary">Write New Post</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Published Articles</span>
        <h3 id="stat-total-posts">3</h3>
      </div>
      <div class="stat-card">
        <span>Total Views</span>
        <h3>1,420</h3>
      </div>
      <div class="stat-card">
        <span>Avg. Read Time</span>
        <h3>4.2 min</h3>
      </div>
    </div>

    <h2 style="font-size:1.4rem; margin-bottom:1rem;">Your Articles</h2>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Article Title</th>
            <th>Category</th>
            <th>Published Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="dashboard-table-body"></tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
