<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Article — Lumina Press</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lumina<span>.</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 780px;">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 2.2rem;">Publish a New Story</h1>
      <p style="color: var(--text-secondary);">Share your insights with readers across the platform.</p>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: var(--shadow-sm);">
      <form onsubmit="handleCreateBlog(event)">
        <div class="form-group">
          <label>Article Title</label>
          <input type="text" id="blog-title" class="form-control" placeholder="Enter an engaging headline..." required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Category</label>
            <select id="blog-category" class="form-control">
              <option value="Design">Design</option>
              <option value="Technology">Technology</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cover Image (Local Asset)</label>
            <select id="blog-image" class="form-control">
              <option value="images/post-1.jpg">Editorial Desk (post-1.jpg)</option>
              <option value="images/post-2.jpg">Tech Workspace (post-2.jpg)</option>
              <option value="images/post-3.jpg">Minimal Lifestyle (post-3.jpg)</option>
              <option value="images/hero-banner.jpg">Hero Studio (hero-banner.jpg)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Short Summary (Excerpt)</label>
          <input type="text" id="blog-excerpt" class="form-control" placeholder="A one-sentence hook for the article card..." required>
        </div>

        <div class="form-group">
          <label>Full Story Content</label>
          <textarea id="blog-content" class="form-control" placeholder="Write your full article here..." required></textarea>
        </div>

        <div style="display:flex; gap:1rem; justify-content:flex-end;">
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary">Publish Article</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
